[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnuter-dit"
version = "0.1.0"
description = "Interactive environment-conditioned DiT trajectory inference for HNUTER"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.scripts]
hnuter-dit-web = "hnuter_dit.web:main"

[tool.setuptools.packages.find]
include = ["hnuter_dit*"]

[tool.setuptools.package-data]
hnuter_dit = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
