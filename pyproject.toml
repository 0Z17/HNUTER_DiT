[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnuter-dit"
version = "0.3.0"
description = "Interactive environment-conditioned DiT trajectory inference for HNUTER"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
simulation = ["mujoco>=3.1", "scipy>=1.10", "toppra>=0.6", "coal>=3.0"]

[project.scripts]
hnuter-dit-web = "hnuter_dit.web:main"
hnuter-dit-interactive = "hnuter_dit.interactive:main"
hnuter-dit-train-v002 = "hnuter_dit.training:main"
hnuter-dit-evaluate = "hnuter_dit.evaluate_models:main"
hnuter-dit-evaluate-obstacle-shift = "hnuter_dit.evaluate_obstacle_shift:main"
hnuter-dit-evaluate-v003 = "hnuter_dit.evaluate_v003:main"
hnuter-dit-tune-guidance = "hnuter_dit.tune_guidance:main"

[tool.setuptools.packages.find]
include = ["hnuter_dit*"]

[tool.setuptools.package-data]
hnuter_dit = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
